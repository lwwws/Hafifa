[project]
name = "web-scraping"
version = "0.1.0"
description = "Captures the HTML, loaded resources and a screenshot of each URL using Playwright."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.64",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order
select = ["E", "W", "F", "I"]
