[project]
name = "threading-multiprocessing"
version = "0.1.0"
description = "Mines the % change of stock prices for given timestamps."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "yfinance>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order
select = ["E", "W", "F", "I"]
