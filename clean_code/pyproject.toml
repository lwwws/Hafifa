[project]
name = "clean-code"
version = "0.1.0"
description = "A simple tkinter MP3 player."
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pygame>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order
select = ["E", "W", "F", "I"]
